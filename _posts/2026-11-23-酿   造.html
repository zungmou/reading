<p> 　　在冬天，我像春风一样爱着落日</p>

<p>那么快就消失了</p>

<p>大地安静得像短暂失去心跳的心房</p>

<p></p>

<p>这一刹那，我像春风一样</p>

<p>温暖着。仿佛落日正在我怀中融化</p>

<p>那麦地，是季节里的秀色</p>

<p></p>

<p>暮色四合。感到一阵滚烫</p>

<p>开始有火星在天空飞溅</p>

<p>渐渐地，野花般燃烧起来</p>

<p></p>

<p>这是我最宽广的时刻。大平原上</p>

<p>郊区是城市和村庄的边缘</p>

<p>我行走在天际与麦田之间</p>

<p></p>

<p>夜色累累如硕果</p>

<p>我怀揣着春风，落日的汁液</p>

<p>酿造今年的绿蚁新酒 </p>
