<p>山高人为峰。他们，是“七一勋章”获得者，是“时代楷模”称号获得者，是中国青年五四奖章获得者……他们，是扎根群众的社区党组织书记，是坚守牧区的基层医生，是不断闯关的科研工作者，是勇于拼搏的世界冠军，是保家卫国的守边战士。国庆期间，让我们走进他们的故事，在那些平凡而又不平凡的人生里，汲取奉献、奋发、坚韧等精神力量，读懂他们以实际行动献给祖国母亲的最深情的爱！</p>

<p>——编&nbsp;&nbsp;者</p>
