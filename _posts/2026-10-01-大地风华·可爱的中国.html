<p>山河锦绣，礼赞我们可爱的中国。国庆之际，本版邀请文艺工作者畅谈塑造“七一勋章”获得者的感悟与收获，解读国粹戏韵里镌刻的长征精神，用歌声传递奋进力量，于侨批山海情中体悟家国情怀，以舞剧致敬以心为栋梁的民族风骨。</p>

<p>即日起，文艺副刊推出“大地风华”系列专版，于人物故事中见初心，于艺术创作中传精神，致敬平凡坚守，共贺盛世华章。</p>

<p>——编&nbsp;&nbsp;者</p>
