<p> 　　离乡那年</p>

<p>月亮就丢了。</p>

<p>自知即便用尽余生也无法找回了，</p>

<p>除去记忆和睡梦。</p>

<p>曾去往夏日的池塘和凛冬</p>

<p>的枝头寻找，</p>

<p>月亮无论处于喧闹或静谧，</p>

<p>都未能予我以满意的回答。</p>

<p>我翻开一幅幅油画，</p>

<p>那低矮的石头围墙</p>

<p>晦暗的灯火边，</p>

<p>马车辙痕</p>

<p>伸向远方。</p>

<p>月光掉进雨后的泥洼，带着潮湿</p>

<p>溅出了画册。 </p>
