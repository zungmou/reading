<p> 　　苏东坡有没有给界首写过诗？</p>

<p>时间知道</p>

<p>文学史家不一定知道</p>

<p></p>

<p>苏东坡如果写界首</p>

<p>一定会写沙颍河，老街</p>

<p>一定会写彩陶</p>

<p>和刚出锅的热腾腾的格拉条</p>

<p></p>

<p>界首挨着阜阳，是阜阳的</p>

<p>一个区域。是阜阳这朵花的</p>

<p>一个花瓣</p>

<p></p>

<p>苏东坡写阜阳那么多首诗。正要</p>

<p>把写界首的诗加以润色</p>

<p>他接到调令，去别处了</p>

<p></p>

<p>他写界首的诗</p>

<p>一定比写阜阳的更好</p>

<p>因为谁都知道</p>

<p>苏东坡的诗</p>

<p>是越写越好的 </p>
