<p>“今人不见古时月，今月曾经照古人。”一轮明月，引动千年情思。人们将对良辰美景的赞叹、对古老神话的遐想、对家国团圆的期盼，融于笔端、刻入木石、糅进泥土，这些艺术作品共同构成中秋独有的浪漫意境。</p>

<p>今天，本版约请专家学者，与读者一同踏入艺术长河，在美的浸润中，与千百年前的品月之人遥遥相望，感悟生生不息的文脉传承与守望家国的深沉情怀。</p>

<p>——编&nbsp;&nbsp;者</p>
