<p>爱国，是华夏儿女血脉中永不改易的情怀。</p>

<p>艺耕不辍，以美传薪。古往今来，一代代美术工作者心怀家国，用刀笔镌刻时代记忆，赓续精神血脉，抒写个体梦想与国家梦想的紧密联系。</p>

<p>今天，本版约请专家学者，与读者一同走进艺术长廊，从一纸“红色山水”里体悟爱国精神，从一座雕塑里倾听国歌回响，从一场展览里读懂人民力量，从一盏灯笼中品味美好祝福，从一壁摩崖上感悟古今豪情，让精神之光照亮奋进之路。</p>

<p>——编&nbsp;&nbsp;者</p>
