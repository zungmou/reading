<p> 　　倾斜的山谷，通往其他世界的</p>

<p>一个入口</p>

<p>绿豹蛱蝶像一封邀请信</p>

<p>飞舞着等待某人</p>

<p>五味子花、凤仙花</p>

<p>托举着不同颜色的护照</p>

<p></p>

<p>众多的航线在身边展开</p>

<p>轻轻一跃，就可开始全新的旅程</p>

<p>这一切让人恍惚</p>

<p></p>

<p>“不是我，不是我……”</p>

<p>我悻悻然地摆摆手</p>

<p>你们如此之美，你们的国度可想而知</p>

<p>而人生太短</p>

<p>我又如何深入太多的传奇 </p>
