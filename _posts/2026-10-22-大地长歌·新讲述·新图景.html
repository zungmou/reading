"></p><p>红色文化在年轻人中有多热？长征题材是生动例证。在短视频、微短剧、动漫、数字艺术等领域，一批善用新技术新工具的大众创作者大显身手，以年轻人喜闻乐见的方式开掘长征历史，讲述长征故事，使伟大长征精神赢得更广泛的共鸣共情。互联网条件下新大众文艺绘就的长征新图景，让我们再次看到，创造是一种宝贵的传承，长征记忆的铸就由一代代人接力完成。</p>
