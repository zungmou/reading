---

<p> 　　他们迎着朝霞收拢锚头</p>

<p>舵轮划出河流的走向</p>

<p>满载的粮食，盛下整个秋天</p>

<p></p>

<p>偶尔路过家乡的湖面</p>

<p>阳光洒在舷窗上</p>

<p>漂泊的船舱有了家的触感</p>

<p>风里裹着芦絮，也裹着乡音</p>

<p></p>

<p>他们谈论着下一段航程</p>

<p>像那些交错的渔网</p>

<p>他们凝视着漫长的岸线</p>

<p>跟着波浪笑开了口</p>

<p></p>

<p>岸边的灯光伫立着，陪伴着</p>

<p>也描述着他们原有的模样 </p>
