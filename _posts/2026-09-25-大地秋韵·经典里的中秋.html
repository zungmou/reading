<p>中秋月圆之夜，中国人总会抬头望。千百年来，这轮秋月牵动古今多少情思，造就多少传诵至今的名篇，为中华文化铺上了温柔而深情的底色。</p>

<p>今日，我们邀您共赏经典里的中秋记忆，跟随名家解读，一起走近文字背后的团圆企盼、家国情怀和开阔胸襟，一起感受大地上的秋韵流转。圆月依旧，文脉相传，这份跨越岁月的深意，依然皎洁地照在我们身上。</p>

<p>——编&nbsp;&nbsp;者</p>
