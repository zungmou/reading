<p> 　　枪，找到了枪</p>

<p>同志，找到了同志</p>

<p>信仰，找到了信仰</p>

<p></p>

<p>手跟手握在一起</p>

<p>握成拳头，举起</p>

<p>如一句句宣言，一个个惊叹号</p>

<p></p>

<p>红旗漫卷</p>

<p>群山列队</p>

<p>松涛欢呼</p>

<p>沿途的山花开成一张张笑脸</p>

<p></p>

<p>“红军不怕远征难，万水千山只等闲”</p>

<p>一位湖南口音的领袖</p>

<p>吟诵的诗句</p>

<p>将历史翻开新的一页…… </p>
