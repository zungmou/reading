<p> 　　中秋，月不再孤单</p>

<p>漂泊的蒲公英</p>

<p>暂时退出劳碌</p>

<p>在各自角落</p>

<p>用簸箕大小的风</p>

<p>擦亮一小块天空</p>

<p>看明月皎洁</p>

<p>似精美玉盘</p>

<p>银辉四溅，引领着</p>

<p>乡愁、祝福与慰藉</p>

<p>羽毛似的缓缓下坠</p>

<p>夜，如此梦幻唯美</p>

<p>远离家乡的蒲公英</p>

<p>向月亮学艺、拜师——</p>

<p>无处不在也无所不至</p>

<p>趁秋天过半，探访</p>

<p>露水湿透的村庄</p>

<p>灯火阑珊的故乡 </p>
