<p>早晨的大平原</p>

<p>每一棵毛白杨都是幸运的</p>

<p>阳光最先摩挲它们的头顶</p>

<p>然后是玉米地，河水响亮起来</p>

<p>然后，抵达我</p>

<p>无尽碧绿之中，猛然澎湃的热浪</p>

<p>一遍遍鼓励我和每一片叶子</p>

<p>找出与生俱来的阴影，点燃它们</p>

<p>突然觉得一切滚烫都充满力量</p>

<p>万物终于有勇气挣脱自己</p>

<p>阳光放弃全部天空</p>

<p>降临在河底每一粒沙上</p>

<p>密不透风的拔节声中</p>

<p>我经过大平原，看到蒸腾的自己</p>
