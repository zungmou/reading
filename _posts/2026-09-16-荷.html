<p>我在河流里，也在池塘里</p>

<p>见到了荷，当然也可以在</p>

<p>想象里遇到荷，像遇到一个</p>

<p>熟悉的朋友，我们可以说到</p>

<p>过往，也可以想象凋零</p>

<p>但更多的人习惯于沉默</p>

<p>就像站在月光里，它洗去了</p>

<p>浮尘，也在水面上</p>

<p>擦去一身的疲惫。有人说到</p>

<p>馥郁，仿佛谈起</p>

<p>另一个人和另外一段时光</p>

<p>从绽放到败落，有一条</p>

<p>很遥远的路要走，也有</p>

<p>许多落叶掉进山涧。此时</p>

<p>在星际之间，星与星正在彼此吸引。</p>
