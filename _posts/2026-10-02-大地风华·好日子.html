<p>时下有个网络流行语——“日子人”，形容踏实勤劳、对生活充满热情的普通人。说起他们，大家总是带着肯定的语气。</p>

<p>这背后，折射出国人对“把日子过好”的满满期待。大到五年规划里的制度密码，小到菜市场里的暖心瞬间，我们在此选取5部与百姓生活密切相关的图书，与读者共同品味好日子从哪里来，又将如何蒸蒸日上。在欢度国庆的节日氛围里，一起感悟生活与时代的热气腾腾、“大国”与“小家”的携手共进。</p>

<p>——编&nbsp;&nbsp;者</p>
