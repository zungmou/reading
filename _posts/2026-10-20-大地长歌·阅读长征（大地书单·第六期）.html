<p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/8cee296f-cbeb-4d87-891d-090b6d5edf8c.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《习近平讲党史故事》：本书编写组编；人民出版社出版。</p>

<p>本书精选习近平总书记讲述过的80余个党史故事，进行深入浅出的解读和阐释。书中收录的故事紧扣党为中国人民谋幸福、为中华民族谋复兴的奋斗足迹，体现了中国共产党人独特的价值追求，帮助读者从理论与实践的结合上深刻理解中国共产党为什么能、马克思主义为什么行、中国特色社会主义为什么好。</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/d4ef5b11-a4fb-44fc-bf9d-a0022d64a5bf.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《红军长征史》：中共中央党史研究室第一研究部编著；中共党史出版社出版。</p>

<p>本书由权威党史、军史研究部门的专家集体编写，凭借丰厚史料、严谨考辨和平实叙述，简明清晰地呈现红军长征这一壮丽史诗的全景，成为记述红军长征历史的经典。</p>

<p>——柳建辉（原中央党校副教育长、党史部主任）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/fcc28a3f-2eb7-4ba3-94f6-c2feb0dc1fc7.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《红军长征记：原始记录》：刘统整理注释；生活·读书·新知三联书店出版。</p>

<p>这是长征刚刚结束时亲历者写下的最原始记录，是研究长征历史不可或缺的第一手资料，读者能从血与火的足迹中真切感受到长征精神。</p>

<p>——褚  银（军事科学院研究员）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/84302947-f376-4f9b-bf22-aacec17a92c0.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《红星照耀中国》：【美】埃德加·斯诺著，董乐山译；人民文学出版社出版。</p>

<p>在众多描写红军长征、描写中国共产党的著作中，《红星照耀中国》堪称标杆性经典。今日中国巍然屹立，而它的种子，早在90年前的延安就已播下。</p>

<p>——潘维廉（厦门大学美籍教授、中国政府友谊奖获得者）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/aa9fecfc-9458-406b-8e53-ff5821adb87c.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《七根火柴》：王愿坚著；上海文艺出版社出版。</p>

<p>一本轻巧的“口袋书”，装着沉甸甸的长征记忆。这七根火柴照亮的不只是征途前路，更是新时代青少年理解长征精神的入口。</p>

<p>——王志庚（中国国家版本馆副馆长）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/61ca1f09-d04d-411d-a7fc-0cd630b7e317.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《苦难辉煌》：金一南著；作家出版社出版。</p>

<p>长征波澜壮阔的伟大征程，蕴藏着中国革命从苦难走向辉煌的历史启示，至今仍具有强大的现实意义和力量。青年学子当从长征精神中汲取养分，争做担当民族复兴大任的时代新人。</p>

<p>——杨振斌（上海交通大学党委书记）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/7dc4afbe-88de-4663-aea0-ec45271883a5.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《长征何以永远》：陈晋著；浙江人民出版社出版。</p>

<p>一支困顿之师何以绝处逢生，一条险途何以开启历史新局？作者秉史家审慎、怀文人深情，回望二万五千里远征，作答“长征何以永远”，让长征精神化作再赴前路的火炬，烛照当代人的征途。</p>

<p>——韩毓海（北京大学习近平新时代中国特色社会主义思想研究院副院长）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/d3e28df1-ee0a-4896-8e06-3e2e3e695f95.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《遵义三日》：胡松涛著；贵州人民出版社出版。</p>

<p>以文学之笔还原遵义会议错综复杂的历史现场，把宏大历史主题落地于生动细节，立体呈现红军长征途中生死攸关的伟大转折。</p>

<p>——党益民（军旅作家）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/34e27655-96fc-4489-bcbc-3dbbd78a0c57.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《十八洞村的十八个故事》：李迪著；作家出版社出版。</p>

<p>从脱贫攻坚到乡村全面振兴，这是新时代长征路上的雪山草地。作家李迪深入“精准扶贫”首倡地采访调研，以质朴的情感、动人的故事，为一个村庄的嬗变留下珍贵记忆。</p>

<p>——吴义勤（中国作协党组成员、副主席）</p>

"></p><p class="not-indent patt" style="max-width:100%;"><img src="../../../pic/202610/20/aa378a71-f303-4b23-80cb-35890c757125.jpg" style="max-width: 100%;" class="picture-illustrating not-indent patt" data-toggle="tooltip" placement="bottom" trigger="hover focus" html="true" data-original-title="<p>《月背征途：中国探月国家队记录人类首次登陆月球背面全过程》：北京航天飞行控制中心著；北京科学技术出版社出版。</p>

<p>嫦娥工程一步一个脚印，为中国航天探索浩瀚宇宙奠定了坚实的基础，这是几代航天人不懈努力、接续奋斗的结果。这本书是探月人的成长纪念册，希望能激励更多年轻人投身航天事业，去探索星辰大海。</p>

<p>——叶培建（中国科学院院士、“人民科学家”国家荣誉称号获得者）</p>

"></p>
