<p>一轮圆月，无疑是中秋夜空中的主角。这枚曾被人类仰望过无数次的天体，在中华民族这个特殊的日子里，被赋予了更加瑰丽的遐想与深远的情感寄托。</p>

<p>皓月当空，光华洒落处，有科学，有人文，有历史，有亲情，有诗意，有烟火……其实，关于月亮的故事，属于月亮，更属于人世间。今日“大地秋韵”，我们与读者分享关于月亮的回忆与随想，愿这些文字也能如中秋的月光，照彻内心的某个地方。</p>

<p>——编&nbsp;&nbsp;者</p>
