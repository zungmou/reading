author: "王富祥"

comments: true
---

<p> 　　成百上千的候鸟，浓缩在</p>

<p>望远镜的两个</p>

<p>观察孔里</p>

<p>自由地降落、起飞。</p>

<p>鸟太多，完全看不清</p>

<p>它们的数量，更分不清</p>

<p>它们的年龄、性别和辈分。</p>

<p></p>

<p>人类在隔离带外，</p>

<p>给候鸟划出安全距离。</p>

<p>护鸟员的职责，</p>

<p>是不分昼夜地守护。</p>

<p></p>

<p>季节被镜头拉近或拉远。</p>

<p>候鸟来往的路线，</p>

<p>成为一条绿色的通道，</p>

<p>专供自由飞翔的翅膀…… </p>
