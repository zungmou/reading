<p> 　　把夏天落在身后</p>

<p>从豆丛里钻出&nbsp;&nbsp;那一股股风</p>

<p>也是深褐色的</p>

<p></p>

<p>风还在吹着&nbsp;&nbsp;奔跑的豆荚</p>

<p>碰到了我的手指</p>

<p>圆滚滚的秋天</p>

<p>啪嗒地蹦出</p>

<p></p>

<p>连枷欢唱着</p>

<p>从这一村&nbsp;&nbsp;到那一户</p>

<p>停不下来的还是风</p>

<p>把一颗颗黑豆挑拣出来</p>

<p></p>

<p>把日子晾干</p>

<p>那黑豆就进入了粮仓</p>

<p>停不下来的还是风</p>

<p>在每颗满怀心事的黑豆里</p>

<p>悄悄藏着 </p>
